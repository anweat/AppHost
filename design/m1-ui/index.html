<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AppHost · M1 交互设计</title>
  <link rel="stylesheet" href="styles.css">
  <script src="assets/icons.js" defer></script>
  <script src="components/app-tile.js" defer></script>
  <script src="components/logs-panel.js" defer></script>
  <script src="components/terminal-panel.js" defer></script>
  <script src="app.js" defer></script>
  <script src="flows.js" defer></script>
</head>
<body>
  <div class="prototype-bar"><strong>M1 · 交互原型</strong><span>示例数据 · 不操作真实进程</span></div>
  <div class="window">
    <header class="toolbar">
      <button class="wordmark" data-action="home" aria-label="AppHost 应用首页"><span class="brand-mark"><i></i><i></i><i></i><i></i></span>AppHost</button>
      <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="搜索应用或分支" placeholder="搜索应用或分支"><kbd>⌘ K</kbd></div>
      <button class="quiet" data-action="manage">管理</button>
      <button class="stop-all" data-action="stop-all"><span aria-hidden="true">■</span> 全部停止</button>
    </header>
    <main id="main"></main>
    <div id="connection-banner"></div>
    <footer class="app-footer"><span id="connection-status">● 后台已连接</span><button class="text-button" data-action="close-window" aria-label="关闭窗口与停止应用的区别">窗口与后台</button></footer>
  </div>
  <details class="demo-controls"><summary>演示场景</summary><div class="demo-actions"><button data-action="reset">默认面板</button><button data-action="empty">首次使用</button><button data-action="free-port">解除示例端口占用</button><button data-action="disconnect">后台断开 / 重连</button></div></details>
  <dialog id="detail" class="drawer" aria-labelledby="detail-title"></dialog>
  <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
