<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Desktop app icon: the mark reversed out of a teal plate (macOS grid: 824 plate, 100 margin). -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23806d"/>
      <stop offset="1" stop-color="#114a3f"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b2a24" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)" filter="url(#drop)"/>
  <g transform="translate(224 224) scale(9)" fill="#fff">
    <rect x="8" y="8" width="48" height="48" rx="15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="9 18 73 0"/>
    <circle cx="51.6" cy="12.4" r="4.5" fill="#7ee0b8"/>
    <rect x="20" y="20" width="24" height="24" rx="7"/>
  </g>
</svg>
