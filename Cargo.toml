[package]
name = "apphost"
version = "0.1.0"
edition = "2024"
description = "Local application manifest and batch registration CLI"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
sha2 = "0.10"
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base64 = "0.22"
