name: Rust checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Compile all targets
        run: cargo +stable check --locked --all-targets
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: macOS regression suite
        if: runner.os == 'macOS'
        run: cargo +stable test --locked --all-targets
      - name: Windows M0 registration and CLI tests
        if: runner.os == 'Windows'
        run: cargo +stable test --locked --test m0
      - name: Windows runtime boundary
        if: runner.os == 'Windows'
        run: cargo +stable test --locked --lib --test m1_platform --test m1_daemon_protocol --test m1_journal --test m1_delivery
      - name: macOS logging smoke
        if: runner.os == 'macOS'
        run: cargo +stable run --locked --example log_probe
      - name: Windows portable installation smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo +stable build --locked --release
          ./tools/windows_smoke.ps1 -Exe ./target/release/apphost.exe
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - run: npm run prepare:backend -- --debug
      - run: npm run build
      - run: npm test
      - name: Desktop Rust format
        run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Desktop bridge Clippy
        run: cargo +stable clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Desktop bridge tests
        run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
      - name: Compile embedded desktop frontend
        run: cargo +stable build --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol
